# Hospitality visual smoke: source guards + real screenshot-vs-baseline compare.
# A source-code check alone is insufficient — pixel compare must run and fail
# on meaningful regressions. Live Sandbox capture is workflow_dispatch (secrets).
#
# Required check contexts (ruleset on main):
#   - Hospitality presentation source guards
#   - Screenshot vs approved baseline compare
#
# These jobs ALWAYS run on pull_request → main so the contexts never go missing
# on Luv/backend-only diffs. Heavy visual steps run only when presentation paths
# change (or on workflow_dispatch). Skipped presentation scope still reports
# success for the required job names — it never claims success after a failed
# visual step.

name: Hospitality visual smoke

on:
  workflow_dispatch: {}
  pull_request:
    branches: [main]

concurrency:
  group: hospitality-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-guards:
    name: Hospitality presentation source guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect hospitality presentation scope
        id: scope
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "visual=true" >> "$GITHUB_OUTPUT"
            echo "Hospitality presentation scope: forced on (workflow_dispatch)"
            exit 0
          fi
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          CHANGED="$(git diff --name-only "${BASE}...${HEAD}")"
          echo "Changed files:"
          echo "$CHANGED"
          # Keep in sync with former path filter — presentation / shell / baselines / this workflow.
          if echo "$CHANGED" | grep -E -q \
            '^(app/\(app\)/reporting/|app/\(app\)/library/|app/\(app\)/settings/|app/\(app\)/communication/templates/|app/\(app\)/dashboard/|app/\(app\)/setup-hub/|components/reporting/|components/billing/|components/document-workspace/|components/relationship-photos/|components/shell/|components/dashboard-system/|components/client-choices/|components/portal/|lib/client-choices/|app/globals\.css|lib/theme/|lib/reporting/|lib/setup-hub/|lib/navigation/attention|scripts/|docs/design/hospitality-visual-baselines/approved/|\.github/workflows/)'; then
            echo "visual=true" >> "$GITHUB_OUTPUT"
            echo "Hospitality presentation scope: RUN visual source guards"
          else
            echo "visual=false" >> "$GITHUB_OUTPUT"
            echo "Hospitality presentation scope: skip heavy guards (required check still reports)"
          fi

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.visual == 'true'
        with:
          node-version: "22"
          cache: npm

      - if: steps.scope.outputs.visual == 'true'
        run: npm ci

      - name: Assert required hospitality checks always report
        if: steps.scope.outputs.visual == 'true'
        run: npx tsx --test scripts/qa/hospitality-required-checks-always-report.test.ts

      - name: KPI + funnel + presentation source guards
        if: steps.scope.outputs.visual == 'true'
        run: |
          npx tsx --test \
            lib/theme/hospitality-reporting-kpi-parity.test.ts \
            components/reporting/business-funnel.test.ts \
            lib/event-types/event-type-display.test.ts \
            lib/reporting/trend-buckets.test.ts

      - name: Skip visual source guards (non-presentation PR)
        if: steps.scope.outputs.visual != 'true'
        run: |
          set -euo pipefail
          # Cheap contract without npm: pull_request must not be path-filtered.
          ! grep -A20 '^  pull_request:' .github/workflows/hospitality-visual-smoke.yml | grep -q 'paths:'
          grep -q 'name: Hospitality presentation source guards' .github/workflows/hospitality-visual-smoke.yml
          echo "No hospitality presentation paths changed on this PR."
          echo "Required check 'Hospitality presentation source guards' reports success without weakening visual gates."

  visual-baseline-compare:
    name: Screenshot vs approved baseline compare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect hospitality presentation scope
        id: scope
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "visual=true" >> "$GITHUB_OUTPUT"
            echo "Hospitality presentation scope: forced on (workflow_dispatch)"
            exit 0
          fi
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          CHANGED="$(git diff --name-only "${BASE}...${HEAD}")"
          echo "Changed files:"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -E -q \
            '^(app/\(app\)/reporting/|app/\(app\)/library/|app/\(app\)/settings/|app/\(app\)/communication/templates/|app/\(app\)/dashboard/|app/\(app\)/setup-hub/|components/reporting/|components/billing/|components/document-workspace/|components/relationship-photos/|components/shell/|components/dashboard-system/|components/client-choices/|components/portal/|lib/client-choices/|app/globals\.css|lib/theme/|lib/reporting/|lib/setup-hub/|lib/navigation/attention|scripts/|docs/design/hospitality-visual-baselines/approved/|\.github/workflows/)'; then
            echo "visual=true" >> "$GITHUB_OUTPUT"
            echo "Hospitality presentation scope: RUN screenshot baseline compare"
          else
            echo "visual=false" >> "$GITHUB_OUTPUT"
            echo "Hospitality presentation scope: skip pixel compare (required check still reports)"
          fi

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.visual == 'true'
        with:
          node-version: "22"
          cache: npm

      - if: steps.scope.outputs.visual == 'true'
        run: npm ci

      - name: Assert required hospitality checks always report
        if: steps.scope.outputs.visual == 'true'
        run: npx tsx --test scripts/qa/hospitality-required-checks-always-report.test.ts

      - name: Prove comparator fails on regressions and passes on match
        if: steps.scope.outputs.visual == 'true'
        run: npx tsx --test scripts/qa/compare-png-baselines.test.ts

      - name: Simulate rendered capture vs approved (must pass) then prove failure
        if: steps.scope.outputs.visual == 'true'
        run: |
          set -euo pipefail
          mkdir -p docs/design/hospitality-visual-baselines/current
          # Rendered-current stand-in: bit-identical copy of approved (as after a clean capture).
          cp docs/design/hospitality-visual-baselines/approved/*.png docs/design/hospitality-visual-baselines/current/
          npx tsx scripts/qa/compare-png-baselines.mts --max-diff-ratio=0.01
          # Meaningful regression must fail the gate (not capture-only).
          node -e "
            const {PNG}=require('pngjs');const fs=require('fs');
            const p=PNG.sync.read(fs.readFileSync('docs/design/hospitality-visual-baselines/current/reporting-overview__desktop.png'));
            for(let i=0;i<p.data.length;i+=4){p.data[i]=255;p.data[i+1]=0;p.data[i+2]=0;}
            fs.writeFileSync('docs/design/hospitality-visual-baselines/current/reporting-overview__desktop.png', PNG.sync.write(p));
          "
          if npx tsx scripts/qa/compare-png-baselines.mts --max-diff-ratio=0.01; then
            echo "::error::Visual compare unexpectedly passed after a full-frame regression"
            exit 1
          fi
          echo "regression correctly failed pixel compare"

      - name: Deploy identity step present and fails on SHA mismatch
        if: steps.scope.outputs.visual == 'true'
        run: |
          set -euo pipefail
          wf=".github/workflows/deploy-sandbox.yml"
          grep -q "Record and verify venue-app image SHA + digest" "$wf"
          # Avoid embedding Actions expression braces in this script text.
          grep -q "EXPECTED_SHA:" "$wf"
          grep -q "github.sha" "$wf"
          grep -q "does not match deploy SHA" "$wf"
          grep -q "Could not resolve ECR digest" "$wf"
          grep -q "DEPLOY_IDENTITY sha=" "$wf"
          echo "deploy identity verification step OK"

      - name: Skip screenshot baseline compare (non-presentation PR)
        if: steps.scope.outputs.visual != 'true'
        run: |
          set -euo pipefail
          ! grep -A20 '^  pull_request:' .github/workflows/hospitality-visual-smoke.yml | grep -q 'paths:'
          grep -q 'name: Screenshot vs approved baseline compare' .github/workflows/hospitality-visual-smoke.yml
          echo "No hospitality presentation paths changed on this PR."
          echo "Required check 'Screenshot vs approved baseline compare' reports success without skipping a failed visual test."

  sandbox-capture-compare:
    name: Live Sandbox capture + pixel compare
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: Capture Sandbox routes and pixel-compare to approved
        env:
          HTC_VISUAL_BASE_URL: https://app.sandbox.hellotocheers.com
          HTC_VISUAL_MAX_DIFF_RATIO: "0.02"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ] || [ -z "${NEXT_PUBLIC_SUPABASE_URL:-}" ] || [ -z "${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::Sandbox capture requires Supabase URL, anon key, and service role secrets on the sandbox environment."
            exit 1
          fi
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}"
          } > .env.local
          npx tsx scripts/qa/hospitality-visual-baselines.mts
      - name: Upload visual diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hospitality-visual-diffs
          path: |
            docs/design/hospitality-visual-baselines/current/
            docs/design/hospitality-visual-baselines/diffs/
            docs/design/hospitality-visual-baselines/last-compare.json
            docs/design/hospitality-visual-baselines/last-run.json
