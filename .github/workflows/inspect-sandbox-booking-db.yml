# Read-only dump of live Sandbox booking/availability definitions.
# workflow_dispatch only. Never mutates the database.
name: Inspect Sandbox Booking DB

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sandbox-database
  cancel-in-progress: false

jobs:
  inspect:
    name: Inspect live function and constraint definitions
    runs-on: ubuntu-latest
    environment: sandbox
    env:
      SANDBOX_DB_URL: ${{ secrets.SANDBOX_DB_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Dump live definitions
        run: |
          if [ -z "$SANDBOX_DB_URL" ]; then
            echo "::error::SANDBOX_DB_URL secret is not set on the sandbox Environment."
            exit 1
          fi
          bash scripts/inspect-sandbox-booking-functions.sh "$SANDBOX_DB_URL"
