# Builds all three apps, pushes SHA-tagged images to ECR, deploys/updates
# infra/htc-ecs-stack.json (the application/compute stack), waits for the
# three ECS services to stabilize, then verifies each app's real HTTP
# endpoint through the ALB before the run is allowed to succeed.
#
# Prerequisites, both one-time and both outside this workflow's reach:
#   1. infra/htc-github-oidc.json deployed manually (OIDC provider + the two
#      IAM roles this workflow assumes/passes).
#   2. infra/htc-ecr-repos.json deployed via deploy-foundation-sandbox.yml
#      (or manually) — the three ECR repos this workflow pushes into.
# See docs/github-actions-deployment-implementation.md.
#
# No application secret values are read, held, or passed by this workflow —
# they live only in AWS Secrets Manager, referenced by the CloudFormation
# template itself. No long-lived AWS credentials are used — authentication
# is via GitHub's OIDC token, scoped to the "sandbox" Environment below.

name: Deploy Sandbox

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  # Fixed, not a GitHub variable — this pipeline is Sandbox-only, single-region
  # by design (confirmed us-east-1), so there's no reason to depend on a
  # variable that was never going to vary and would silently break this step
  # if left unset.
  AWS_REGION: us-east-1

jobs:
  build-and-push:
    name: Build & push (${{ matrix.name }})
    runs-on: ubuntu-latest
    environment: sandbox
    strategy:
      matrix:
        include:
          # NEXT_PUBLIC_APP_URL / NEXT_PUBLIC_MARKETING_URL / NEXT_PUBLIC_SITE_URL /
          # NEXT_PUBLIC_PRODUCT_APP_URL / NEXT_PUBLIC_WORKSPACE_URL below are
          # hardcoded, not vars.* — same reasoning as AWS_REGION above: these
          # are the Sandbox environment's own fixed hostnames (see
          # infra/htc-ecs-stack.json's VenueAppHostname/MarketingHostname/
          # WorkspaceHostname parameter Defaults, which they match exactly),
          # never meant to vary, and a silently-empty vars.* reference here
          # previously baked broken absolute URLs into every image. Only
          # Supabase (real project not yet provisioned) and the six genuinely
          # optional integrations remain vars.*-driven.
          - name: venue-app
            dockerfile: Dockerfile
            repo_var: htc-sandbox-venue-app
            build_args: |
              NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
              NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
              NEXT_PUBLIC_APP_URL=https://app.sandbox.hellotocheers.com
              NEXT_PUBLIC_MARKETING_URL=https://sandbox.hellotocheers.com
              NEXT_PUBLIC_STRIPE_CLIENT_ID=${{ vars.NEXT_PUBLIC_STRIPE_CLIENT_ID }}
              NEXT_PUBLIC_FACEBOOK_APP_ID=${{ vars.NEXT_PUBLIC_FACEBOOK_APP_ID }}
              NEXT_PUBLIC_QUICKBOOKS_CLIENT_ID=${{ vars.NEXT_PUBLIC_QUICKBOOKS_CLIENT_ID }}
              NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
              NEXT_PUBLIC_NOTIFICATIONS_SECRET=${{ vars.NEXT_PUBLIC_NOTIFICATIONS_SECRET }}
              NEXT_PUBLIC_WEVENU_ADMIN=${{ vars.NEXT_PUBLIC_WEVENU_ADMIN }}
          - name: marketing
            dockerfile: marketing/Dockerfile
            repo_var: htc-sandbox-marketing
            build_args: |
              NEXT_PUBLIC_MARKETING_URL=https://sandbox.hellotocheers.com
              NEXT_PUBLIC_SITE_URL=https://sandbox.hellotocheers.com
              NEXT_PUBLIC_PRODUCT_APP_URL=https://app.sandbox.hellotocheers.com
              NEXT_PUBLIC_CALENDLY_URL=${{ vars.NEXT_PUBLIC_CALENDLY_URL }}
          - name: workspace
            dockerfile: workspace/Dockerfile
            repo_var: htc-sandbox-workspace
            build_args: |
              NEXT_PUBLIC_APP_URL=https://app.sandbox.hellotocheers.com
              NEXT_PUBLIC_MARKETING_URL=https://sandbox.hellotocheers.com
              NEXT_PUBLIC_PRODUCT_APP_URL=https://app.sandbox.hellotocheers.com
              NEXT_PUBLIC_SITE_URL=https://sandbox.hellotocheers.com
              NEXT_PUBLIC_WORKSPACE_URL=https://workspace.sandbox.hellotocheers.com
    steps:
      - name: Checkout
        # Full checkout, repo root — marketing/ and workspace/ both import
        # ../shared/*, so a shallow/sparse checkout or per-app subdirectory
        # checkout would break their build context.
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # Fails the run immediately, with every missing value named at once,
      # instead of baking an empty NEXT_PUBLIC_SUPABASE_URL/ANON_KEY into a
      # pushed image and only discovering it's broken once a container is
      # already running (or not at all, since these aren't checked by the
      # ALB health check — see Verify ALB endpoints below).
      - name: Validate required build configuration
        if: matrix.name == 'venue-app'
        run: |
          missing=()
          [ -z "${{ vars.NEXT_PUBLIC_SUPABASE_URL }}" ] && missing+=("NEXT_PUBLIC_SUPABASE_URL")
          [ -z "${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" ] && missing+=("NEXT_PUBLIC_SUPABASE_ANON_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required sandbox Environment variable(s), needed to build a working venue-app image: ${missing[*]}"
            exit 1
          fi

      - name: Build
        env:
          BUILD_ARGS: ${{ matrix.build_args }}
          IMAGE_URI: ${{ steps.ecr-login.outputs.registry }}/${{ matrix.repo_var }}:${{ github.sha }}
        run: |
          ARGS=()
          while IFS= read -r line; do
            [ -n "$line" ] && ARGS+=(--build-arg "$line")
          done <<< "$BUILD_ARGS"
          docker build -f "${{ matrix.dockerfile }}" -t "$IMAGE_URI" "${ARGS[@]}" .

      - name: Push
        env:
          IMAGE_URI: ${{ steps.ecr-login.outputs.registry }}/${{ matrix.repo_var }}:${{ github.sha }}
        run: docker push "$IMAGE_URI"

  deploy:
    name: Deploy application stack
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: sandbox
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Resolve ECR registry
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # Fails the run immediately, naming every missing value at once,
      # instead of letting `aws cloudformation deploy` silently pass an
      # empty string to a CloudFormation parameter and discovering the
      # break one resource at a time (e.g. an empty ListenerRule condition,
      # "A condition value cannot be empty") several minutes into resource
      # creation. Only SupabaseUrl remains here — the hostnames/email were
      # promoted to hardcoded values below (see that step's comment); a real
      # Supabase Sandbox project genuinely doesn't exist yet, so this one
      # can't be hardcoded and must keep failing loudly until it's set.
      - name: Validate required deploy configuration
        run: |
          missing=()
          [ -z "${{ vars.SUPABASE_URL }}" ] && missing+=("SUPABASE_URL")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required sandbox Environment variable(s), needed to deploy infra/htc-ecs-stack.json: ${missing[*]}"
            exit 1
          fi

      - name: Deploy htc-ecs-stack.json
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          SHA: ${{ github.sha }}
        run: |
          aws cloudformation deploy \
            --template-file infra/htc-ecs-stack.json \
            --stack-name "${{ vars.CFN_STACK_NAME }}" \
            --parameter-overrides \
              EnvironmentName=sandbox \
              VenueAppImage="$REGISTRY/htc-sandbox-venue-app:$SHA" \
              MarketingImage="$REGISTRY/htc-sandbox-marketing:$SHA" \
              WorkspaceImage="$REGISTRY/htc-sandbox-workspace:$SHA" \
              VenueAppHostname=app.sandbox.hellotocheers.com \
              MarketingHostname=sandbox.hellotocheers.com \
              WorkspaceHostname=workspace.sandbox.hellotocheers.com \
              FromEmailAddress="Hello to Cheers <jennifer@hellotocheers.com>" \
              EmailReplyTo=jennifer@hellotocheers.com \
              SupabaseUrl="${{ vars.SUPABASE_URL }}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --role-arn "${{ vars.CFN_EXECUTION_ROLE_ARN }}" \
            --no-fail-on-empty-changeset

  verify:
    name: Wait & verify
    needs: deploy
    runs-on: ubuntu-latest
    environment: sandbox
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Wait for ECS services to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster htc-sandbox \
            --services htc-sandbox-venue-app htc-sandbox-marketing htc-sandbox-workspace

      - name: Verify ALB endpoints
        run: |
          ALB_DNS=$(aws cloudformation describe-stacks \
            --stack-name "${{ vars.CFN_STACK_NAME }}" \
            --query "Stacks[0].Outputs[?OutputKey=='AlbDnsName'].OutputValue" \
            --output text)

          check() {
            local host="$1" path="$2" expected_pattern="$3" label="$4"
            local code
            code=$(curl -s -o /dev/null -w "%{http_code}" -H "Host: $host" "http://$ALB_DNS$path")
            echo "$label ($host$path) -> $code"
            if ! [[ "$code" =~ $expected_pattern ]]; then
              echo "::error::$label returned $code, expected pattern $expected_pattern"
              exit 1
            fi
          }

          # Venue app's /login is always a clean 200. Marketing's / is a
          # clean 200. Workspace's / issues its own 307 session-gate
          # redirect by design — confirmed by actually running the
          # container, not assumed — so 200-399 is the correct pass range
          # there, matching the ALB target group's own health-check matcher.
          #
          # Hardcoded, matching the deploy job's own VenueAppHostname/
          # MarketingHostname/WorkspaceHostname parameter overrides — these
          # must always agree with what was actually deployed, so they are
          # not independently vars.*-sourced here.
          check "app.sandbox.hellotocheers.com" "/login" "^200$" "venue app"
          check "sandbox.hellotocheers.com" "/" "^200$" "marketing"
          check "workspace.sandbox.hellotocheers.com" "/" "^(2|3)[0-9]{2}$" "workspace"

          # /login returning 200 only proves the page shell rendered - it
          # does not require a successful Supabase query, so a container
          # with entirely broken Supabase credentials still passes the
          # check above. /api/health (app/api/health/route.ts) runs one
          # real, read-only Supabase query with the container's actual
          # runtime credentials and only returns 200 if it succeeds - this
          # is the check that actually proves the deployed app can talk to
          # its database, not just that the process is up.
          check "app.sandbox.hellotocheers.com" "/api/health" "^200$" "venue app real Supabase connectivity"

      - name: Validate Secrets Manager values are populated
        # describe-secret confirms existence without ever reading the value.
        # get-secret-value is only used to check for the literal CHANGE_ME
        # placeholder the CloudFormation template inserts at stack creation
        # (infra/htc-ecs-stack.json) - the value is masked immediately and
        # never echoed, logged, or compared to anything but that one known
        # placeholder string.
        run: |
          check_secret() {
            local id="$1" jsonpath="$2" label="$3"
            if ! aws secretsmanager describe-secret --secret-id "$id" >/dev/null 2>&1; then
              echo "::error::Secret '$id' ($label) does not exist in Secrets Manager - the stack was not deployed correctly."
              exit 1
            fi
            local val
            val=$(aws secretsmanager get-secret-value --secret-id "$id" --query SecretString --output text | jq -r "$jsonpath")
            echo "::add-mask::$val"
            if [ -z "$val" ] || [[ "$val" == *"CHANGE_ME"* ]]; then
              echo "::warning::Secret '$id' ($label) still contains its CHANGE_ME placeholder - populate the real value with 'aws secretsmanager put-secret-value' before this capability will work."
            else
              echo "$id ($label): populated"
            fi
          }
          check_secret "htc/sandbox/supabase-service-role-key" ".value" "Supabase service-role key"
          check_secret "htc/sandbox/resend-api-key" ".value" "Resend API key"
          check_secret "htc/sandbox/product-sync-api-key" ".value" "Product sync API key"
          check_secret "htc/sandbox/stripe-saas" ".STRIPE_SECRET_KEY" "Stripe SaaS secret key"
          check_secret "htc/sandbox/stripe-connect" ".STRIPE_SECRET_KEY" "Stripe Connect secret key"
          echo "All 5 expected secrets exist. Any '::warning::' above means that specific capability (not the deploy itself) won't work until the real value is set - see the Sandbox infra report for which ones are required vs. deferrable."

      - name: Verify Sandbox database readiness (optional)
        # Runs scripts/verify-sandbox-database.sh against the real project
        # only if SANDBOX_DB_URL is set - this is deliberately NOT one of
        # the required sandbox Environment variables, since it's a new,
        # optional capability this pass adds, not an existing requirement.
        # Skips cleanly (does not fail the workflow) when unset, with a
        # clear note on how to enable it going forward.
        run: |
          if [ -z "${{ vars.SANDBOX_DB_URL }}" ]; then
            echo "SANDBOX_DB_URL is not set - skipping full database verification (migrations/extensions/reference data/RLS/buckets)."
            echo "To enable this check on every future deploy, add a 'SANDBOX_DB_URL' sandbox Environment variable with the project's Session Pooler connection string (Supabase Dashboard -> Project Settings -> Database -> Connection string)."
            exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -qq -y postgresql-client
          bash scripts/verify-sandbox-database.sh "${{ vars.SANDBOX_DB_URL }}"
