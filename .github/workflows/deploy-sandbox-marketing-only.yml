# Marketing-only Sandbox deploy.
# Builds/pushes htc-sandbox-marketing for an explicit ref, then updates ONLY
# MarketingImage via CloudFormation (UsePreviousValue for venue/workspace/
# scheduler images and all other stack parameters).
#
# Why CFN (not ecs:RegisterTaskDefinition):
# The live GHA role `htc-sandbox-github-actions-deploy` can DescribeServices /
# UpdateService via CFN execution role, but does NOT include
# ecs:DescribeTaskDefinition / ecs:RegisterTaskDefinition (confirmed 2026-11-11
# against policy HtcSandboxDeploy). Direct TD register fails AccessDenied.
#
# Does not touch Production. Does not build venue-app / workspace / scheduler.

name: Deploy Sandbox Marketing Only

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git SHA or ref to deploy (marketing image tag)"
        required: true
        type: string

concurrency:
  group: deploy-sandbox-marketing-only
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  build-and-deploy:
    name: Build & deploy marketing
    runs-on: ubuntu-latest
    environment: sandbox
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve deploy SHA
        id: sha
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Deploying marketing at $SHA"

      # Same-image verification / redeploys: reuse the ECR tag when it already
      # exists so we do not bake a different digest under the same SHA tag.
      # Use BatchGetImage (granted on the deploy role). DescribeImages is NOT.
      - name: Detect existing marketing image
        id: image
        env:
          IMAGE_URI: ${{ steps.ecr-login.outputs.registry }}/htc-sandbox-marketing:${{ steps.sha.outputs.sha }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          set +e
          OUT=$(aws ecr batch-get-image \
            --repository-name htc-sandbox-marketing \
            --image-ids "imageTag=${SHA}" \
            --query 'images[0].imageId.imageDigest' \
            --output text 2>/tmp/mkt-image-detect.err)
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            echo "::error::ECR batch-get-image failed while detecting existing tag $SHA"
            cat /tmp/mkt-image-detect.err >&2 || true
            exit "$RC"
          fi
          # Missing tag returns empty Images[] → query text is "None"
          if [ -n "$OUT" ] && [ "$OUT" != "None" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=$OUT" >> "$GITHUB_OUTPUT"
            echo "Reusing existing $IMAGE_URI ($OUT)"
            exit 0
          fi
          echo "exists=false" >> "$GITHUB_OUTPUT"
          echo "No existing image for tag $SHA — will build and push"

      - name: Prefetch base images (private ECR, then Public ECR)
        if: steps.image.outputs.exists != 'true'
        run: |
          set -euo pipefail
          REGISTRY="${{ steps.ecr-login.outputs.registry }}"
          retry_pull() {
            local image="$1"
            local local_tag="$2"
            local attempt=1
            local delay=5
            while [ "$attempt" -le 5 ]; do
              echo "Pull attempt $attempt/5: $image"
              if docker pull "$image"; then
                docker tag "$image" "$local_tag"
                return 0
              fi
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
            return 1
          }
          pull_base() {
            local private_tag="$1"
            local public_image="$2"
            local local_tag="$public_image"
            if docker pull "${REGISTRY}/htc-ci-bases:${private_tag}"; then
              docker tag "${REGISTRY}/htc-ci-bases:${private_tag}" "$local_tag"
              return 0
            fi
            if retry_pull "$public_image" "$local_tag"; then
              docker tag "$local_tag" "${REGISTRY}/htc-ci-bases:${private_tag}"
              docker push "${REGISTRY}/htc-ci-bases:${private_tag}" || true
              return 0
            fi
            echo "::error::Failed to pull ${local_tag}"
            return 1
          }
          pull_base node-22-alpine public.ecr.aws/docker/library/node:22-alpine
          pull_base alpine-3.20 public.ecr.aws/docker/library/alpine:3.20

      - name: Build marketing image
        if: steps.image.outputs.exists != 'true'
        env:
          IMAGE_URI: ${{ steps.ecr-login.outputs.registry }}/htc-sandbox-marketing:${{ steps.sha.outputs.sha }}
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          set -euo pipefail
          CALENDLY_LEN_PROBE="${{ vars.NEXT_PUBLIC_CALENDLY_URL }}"
          echo "Marketing bake: NEXT_PUBLIC_CALENDLY_URL length=${#CALENDLY_LEN_PROBE}"
          if [ -z "$CALENDLY_LEN_PROBE" ]; then
            echo "::warning::NEXT_PUBLIC_CALENDLY_URL is empty — /walkthrough will show scheduling fallback"
          fi
          REWRITTEN="$(mktemp)"
          ./scripts/ci/rewrite-sandbox-dockerfile-bases.sh \
            marketing/Dockerfile \
            "$REWRITTEN" \
            "$ECR_REGISTRY"
          if grep -E '^FROM[[:space:]]+public\.ecr\.aws/docker/library/' "$REWRITTEN"; then
            echo "::error::rewritten Dockerfile still references public.ecr.aws/docker/library"
            exit 1
          fi
          attempt=1
          delay=10
          while [ "$attempt" -le 3 ]; do
            echo "Build attempt $attempt/3 for marketing"
            if docker build --pull=false -f "$REWRITTEN" \
              --build-arg "NEXT_PUBLIC_MARKETING_URL=https://sandbox.hellotocheers.com" \
              --build-arg "NEXT_PUBLIC_SITE_URL=https://sandbox.hellotocheers.com" \
              --build-arg "NEXT_PUBLIC_PRODUCT_APP_URL=https://app.sandbox.hellotocheers.com" \
              --build-arg "NEXT_PUBLIC_CALENDLY_URL=${{ vars.NEXT_PUBLIC_CALENDLY_URL }}" \
              --build-arg "NEXT_PUBLIC_GA4_MEASUREMENT_ID=${{ vars.NEXT_PUBLIC_GA4_MEASUREMENT_ID }}" \
              -t "$IMAGE_URI" .; then
              rm -f "$REWRITTEN"
              exit 0
            fi
            sleep "$delay"
            attempt=$((attempt + 1))
            delay=$((delay * 2))
          done
          rm -f "$REWRITTEN"
          echo "::error::docker build failed for marketing after 3 attempts"
          exit 1

      - name: Push marketing image
        if: steps.image.outputs.exists != 'true'
        env:
          IMAGE_URI: ${{ steps.ecr-login.outputs.registry }}/htc-sandbox-marketing:${{ steps.sha.outputs.sha }}
        run: docker push "$IMAGE_URI"

      - name: Snapshot non-marketing task definitions (pre-deploy)
        id: pre
        run: |
          set -euo pipefail
          for svc in htc-sandbox-venue-app htc-sandbox-workspace htc-sandbox-scheduler; do
            td=$(aws ecs describe-services --cluster htc-sandbox --services "$svc" \
              --query 'services[0].taskDefinition' --output text)
            echo "$svc=$td"
            echo "${svc//=/_}=$td" >> "$GITHUB_OUTPUT"
          done
          # GitHub output keys cannot contain hyphens easily; write a file instead.
          aws ecs describe-services --cluster htc-sandbox \
            --services htc-sandbox-venue-app htc-sandbox-workspace htc-sandbox-scheduler \
            --query 'services[].{name:serviceName,td:taskDefinition}' --output json \
            > /tmp/pre-non-marketing-tds.json
          cat /tmp/pre-non-marketing-tds.json

      - name: Update MarketingImage only via CloudFormation
        env:
          IMAGE_URI: ${{ steps.ecr-login.outputs.registry }}/htc-sandbox-marketing:${{ steps.sha.outputs.sha }}
          SHA: ${{ steps.sha.outputs.sha }}
          STACK: ${{ vars.CFN_STACK_NAME }}
          ROLE: ${{ vars.CFN_EXECUTION_ROLE_ARN }}
        run: |
          set -euo pipefail
          CS="mkt-only-${SHA:0:12}-$(date +%s)"
          echo "Change set: $CS"
          echo "MarketingImage=$IMAGE_URI"
          # Only MarketingImage changes. Every other parameter keeps the live
          # stack value so venue/workspace/scheduler images are untouched.
          PARAMS=(
            "ParameterKey=MarketingImage,ParameterValue=$IMAGE_URI"
            "ParameterKey=EnvironmentName,UsePreviousValue=true"
            "ParameterKey=VenueAppImage,UsePreviousValue=true"
            "ParameterKey=WorkspaceImage,UsePreviousValue=true"
            "ParameterKey=SchedulerImage,UsePreviousValue=true"
            "ParameterKey=VenueAppHostname,UsePreviousValue=true"
            "ParameterKey=MarketingHostname,UsePreviousValue=true"
            "ParameterKey=WorkspaceHostname,UsePreviousValue=true"
            "ParameterKey=CertificateArn,UsePreviousValue=true"
            "ParameterKey=FromEmailAddress,UsePreviousValue=true"
            "ParameterKey=EmailReplyTo,UsePreviousValue=true"
            "ParameterKey=InquiryNotifyEmail,UsePreviousValue=true"
            "ParameterKey=SupabaseUrl,UsePreviousValue=true"
            "ParameterKey=SupabaseAnonKey,UsePreviousValue=true"
            "ParameterKey=ResendInboundAddress,UsePreviousValue=true"
            "ParameterKey=CronSecret,UsePreviousValue=true"
            "ParameterKey=NotificationsSecret,UsePreviousValue=true"
            "ParameterKey=CommunicationMode,UsePreviousValue=true"
            "ParameterKey=StripePriceStarter,UsePreviousValue=true"
            "ParameterKey=StripePriceGrowing,UsePreviousValue=true"
            "ParameterKey=StripePriceGrowingFounder,UsePreviousValue=true"
            "ParameterKey=StripePriceProfessional,UsePreviousValue=true"
            "ParameterKey=StripePriceProfessionalFounder,UsePreviousValue=true"
            "ParameterKey=StripePriceWhiteGlove,UsePreviousValue=true"
            "ParameterKey=StripeFoundingCouponId,UsePreviousValue=true"
            "ParameterKey=StripePriceGather199,UsePreviousValue=true"
            "ParameterKey=StripeFoundingPercentCouponId,UsePreviousValue=true"
            "ParameterKey=PricingLaunchV1,UsePreviousValue=true"
            "ParameterKey=StripeWevenPercentCouponId,UsePreviousValue=true"
            "ParameterKey=StripePriceWhiteGloveWeven,UsePreviousValue=true"
            "ParameterKey=PricingWevenV1,UsePreviousValue=true"
            "ParameterKey=StripeGroupPercentCouponId,UsePreviousValue=true"
            "ParameterKey=PricingGroupV1,UsePreviousValue=true"
            "ParameterKey=StripeSaasProductId,UsePreviousValue=true"
            "ParameterKey=PricingFounderV1,UsePreviousValue=true"
            "ParameterKey=ReferralProgramV1,UsePreviousValue=true"
            "ParameterKey=ReferralRewardIssue,UsePreviousValue=true"
            "ParameterKey=ReferralQualificationDays,UsePreviousValue=true"
            "ParameterKey=PricingTierUpgradeStore,UsePreviousValue=true"
            "ParameterKey=TierUpgradeApplyStripe,UsePreviousValue=true"
            "ParameterKey=TierUpgradeSendNotice,UsePreviousValue=true"
          )
          # Use the LIVE stack template so deploying an older marketing SHA
          # cannot accidentally roll infra/template drift from that commit.
          # IMPORTANT: --query TemplateBody --output text breaks on JSON
          # templates (aws CLI: 'str' object has no attribute 'items').
          aws cloudformation get-template --stack-name "$STACK" --template-stage Processed \
            --output json > /tmp/htc-ecs-stack-raw.json
          python3 - <<'PY'
          import json
          raw = json.load(open("/tmp/htc-ecs-stack-raw.json"))
          body = raw["TemplateBody"]
          if isinstance(body, dict):
              json.dump(body, open("/tmp/htc-ecs-stack-live.json", "w"))
          else:
              open("/tmp/htc-ecs-stack-live.json", "w").write(body)
          PY
          aws cloudformation create-change-set \
            --stack-name "$STACK" \
            --change-set-name "$CS" \
            --template-body file:///tmp/htc-ecs-stack-live.json \
            --capabilities CAPABILITY_NAMED_IAM \
            --role-arn "$ROLE" \
            --change-set-type UPDATE \
            --parameters "${PARAMS[@]}"

          for _ in $(seq 1 40); do
            st=$(aws cloudformation describe-change-set --stack-name "$STACK" --change-set-name "$CS" --query Status --output text)
            case "$st" in CREATE_COMPLETE|FAILED) break ;; esac
            sleep 2
          done

          aws cloudformation describe-change-set --stack-name "$STACK" --change-set-name "$CS" --output json \
            > /tmp/mkt-only-changeset.json
          python3 <<'PY'
          import json, sys
          d = json.load(open("/tmp/mkt-only-changeset.json"))
          status, reason = d.get("Status"), d.get("StatusReason") or ""
          if status == "FAILED" and "didn't contain changes" in reason:
              print("No stack changes (MarketingImage already current).")
              open("/tmp/mkt-only-empty", "w").write("1")
              sys.exit(0)
          if status != "CREATE_COMPLETE":
              print(f"::error::Change set status {status}: {reason}")
              sys.exit(1)
          changes = d.get("Changes") or []
          for c in changes:
              rc = c["ResourceChange"]
              print(f"  {rc.get('Action')} {rc.get('LogicalResourceId')} {rc.get('ResourceType')}")
          # Refuse any change that is not marketing-related.
          bad = [
              c["ResourceChange"]["LogicalResourceId"]
              for c in changes
              if "Marketing" not in c["ResourceChange"]["LogicalResourceId"]
              and c["ResourceChange"].get("Action") in ("Modify", "Remove", "Add")
          ]
          # Allow shared resources only if they are purely tag/metadata — still
          # fail closed on venue/workspace/scheduler logical IDs.
          blocked = [
              lid for lid in bad
              if any(x in lid for x in ("VenueApp", "Workspace", "Scheduler", "Facebook", "Https"))
          ]
          if blocked:
              print("::error::Change set would touch non-marketing resources: " + ", ".join(blocked))
              sys.exit(1)
          PY
          if [ -f /tmp/mkt-only-empty ]; then
            echo "CHANGE_SET_EMPTY=1" >> "$GITHUB_ENV"
          else
            echo "CHANGE_SET_NAME=$CS" >> "$GITHUB_ENV"
            aws cloudformation execute-change-set --stack-name "$STACK" --change-set-name "$CS"
            aws cloudformation wait stack-update-complete --stack-name "$STACK"
          fi

      - name: Wait for marketing service stable
        env:
          STACK: ${{ vars.CFN_STACK_NAME }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          aws ecs wait services-stable \
            --cluster htc-sandbox \
            --services htc-sandbox-marketing
          aws ecs describe-services \
            --cluster htc-sandbox \
            --services htc-sandbox-marketing \
            --query 'services[0].{taskDefinition:taskDefinition,running:runningCount,desired:desiredCount,rollout:deployments[0].rolloutState}' \
            --output json
          # Prefer CFN parameter (readable by GHA role) over ecs:DescribeTaskDefinition
          # which is NOT granted on the live deploy role.
          CFN_IMG=$(aws cloudformation describe-stacks --stack-name "$STACK" \
            --query "Stacks[0].Parameters[?ParameterKey=='MarketingImage'].ParameterValue" \
            --output text)
          echo "CFN_MARKETING_IMAGE=$CFN_IMG"
          echo "$CFN_IMG" | grep -q "$SHA" \
            || { echo "::error::Stack MarketingImage does not contain expected SHA $SHA"; exit 1; }

      - name: Verify marketing ALB routes and non-marketing TDs unchanged
        run: |
          set -euo pipefail
          BASE=https://sandbox.hellotocheers.com
          fail=0
          for path in / /pricing /contact /walkthrough /trust /features /product /our-story; do
            code=$(curl -sS -o /tmp/mkt-body -w '%{http_code}' --max-time 30 "$BASE$path" || echo 000)
            echo "$path -> $code"
            if [ "$code" != "200" ]; then
              echo "::error::$path returned $code"
              fail=1
            fi
          done
          pricing=$(curl -sS --max-time 30 "$BASE/pricing")
          contact=$(curl -sS --max-time 30 "$BASE/contact")
          echo "$pricing" | grep -q 'Get Started' || { echo '::error::Pricing missing Get Started'; fail=1; }
          echo "$pricing" | grep -Eqi 'first[[:space:]]+[0-9]+[[:space:]]+eligible' || { echo '::error::Pricing missing founding phrase'; fail=1; }
          echo "$contact" | grep -Eq "We('\'')d love to hear from you|We&#x27;d love to hear from you" \
            || { echo '::error::Contact missing approved headline'; fail=1; }

          python3 <<'PY'
          import json, subprocess, sys
          pre = {r["name"]: r["td"] for r in json.load(open("/tmp/pre-non-marketing-tds.json"))}
          out = subprocess.check_output([
            "aws","ecs","describe-services","--cluster","htc-sandbox",
            "--services","htc-sandbox-venue-app","htc-sandbox-workspace","htc-sandbox-scheduler",
            "--query","services[].{name:serviceName,td:taskDefinition}","--output","json"
          ], text=True)
          post = {r["name"]: r["td"] for r in json.loads(out)}
          changed = False
          for name, td in pre.items():
              now = post.get(name)
              print(f"untouched_check {name} pre={td} post={now}")
              if now != td:
                  print(f"::error::{name} task definition changed during marketing-only deploy")
                  changed = True
          sys.exit(1 if changed else 0)
          PY
          exit "$fail"
