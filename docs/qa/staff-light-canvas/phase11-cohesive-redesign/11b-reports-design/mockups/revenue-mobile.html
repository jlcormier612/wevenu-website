<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=390" />
  <title>PROPOSAL — Revenue Mobile</title>
  <link rel="stylesheet" href="_shared.css" />
  <style>body{max-width:390px;margin:0 auto;border-left:1px solid #ddd;border-right:1px solid #ddd}.grid{grid-template-columns:1fr}</style>
</head>
<body>
  <div class="banner"><strong>DESIGN PROPOSAL ONLY</strong> — Revenue mobile</div>
  <div class="shell">
    <div class="intro"><h1>Reports</h1><p>How your business is doing.</p></div>
    <div class="tabs"><span class="tab">Overview</span><span class="tab active">Revenue</span><span class="tab">Saved</span></div>
    <div class="filter"><span class="chip on">This month</span></div>
    <div class="grid">
      <div class="kpi tone-money"><div class="head">Contracted</div><div class="body"><p class="value">$86,400</p><p class="delta good">↑ 8%</p></div></div>
      <div class="kpi tone-money"><div class="head">Collected</div><div class="body"><p class="value">$41,200</p><p class="delta good">↑ 14%</p></div></div>
      <div class="kpi tone-owed"><div class="head">Outstanding</div><div class="body"><p class="value">$45,200</p><p class="delta bad">↑ 6%</p></div></div>
      <div class="kpi tone-money"><div class="head">Avg. contracted</div><div class="body"><p class="value">$9,600</p></div></div>
    </div>
    <div class="panel"><h3>Revenue Trend</h3><div style="height:90px;background:var(--botanical-pale);border-radius:0.45rem;opacity:0.55"></div></div>
  </div>
</body>
</html>
